[project]
name = "my-ai-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "neel20409", email = "bhattneel2004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[project.optional-dependencies]
torch = ["torch>=2.14.1", "torchvision>=0.18"]
llm = ["anthropic>=0.39", "openai>=1.50"]

[project.scripts]
my-ai-project = "my_ai_project:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
